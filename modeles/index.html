<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ctnRacer – Modèles 3D</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #15181c;
        --panel: #1f242a;
        --line: #353c44;
        --text: #f1f3f5;
        --muted: #9aa4ae;
        --accent: #e8642a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.4 system-ui, sans-serif;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        font-size: 1.05rem;
      }
      header a {
        color: var(--text);
        text-decoration: none;
        font-size: 0.95rem;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .row {
        display: flex;
        gap: 8px;
        padding: 10px 14px 0;
        overflow-x: auto;
      }
      .row button {
        flex: none;
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 16px;
        cursor: pointer;
      }
      .row button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
      }
      #tabs button {
        border-radius: 8px;
      }
      main {
        position: relative;
        flex: 1;
        min-height: 0;
        margin-top: 10px;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 20px;
        color: var(--muted);
        text-align: center;
        pointer-events: none;
      }
      #status[hidden] {
        display: none;
      }
      #hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 6px;
        margin: 0;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
        pointer-events: none;
      }
      section {
        padding: 12px 14px 14px;
        background: var(--panel);
        border-top: 1px solid var(--line);
      }
      section h2 {
        margin: 0 0 6px;
        font-size: 1.05rem;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 14px;
        margin: 0 0 10px;
        font-size: 0.92rem;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
      }
      .toggles {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
      }
      .toggles label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .toggles button {
        font: inherit;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/admin/">← Admin</a>
      <h1>Modèles 3D</h1>
      <a href="/">Jeu</a>
    </header>

    <nav id="tabs" class="row" aria-label="Catégories"></nav>
    <nav id="chips" class="row" aria-label="Modèles"></nav>

    <main>
      <canvas id="view"></canvas>
      <p id="status">Chargement des modèles…</p>
      <p id="hint">Glisse pour tourner · pince ou molette pour zoomer</p>
    </main>

    <section>
      <h2 id="name">–</h2>
      <dl>
        <dt>Nom dans le fichier</dt>
        <dd id="node">–</dd>
        <dt>Dimensions</dt>
        <dd id="size">–</dd>
        <dt>Roues</dt>
        <dd id="wheels">–</dd>
        <dt>Triangles</dt>
        <dd id="triangles">–</dd>
      </dl>
      <div class="toggles">
        <label><input type="checkbox" id="spin" checked /> Rotation automatique</label>
        <label><input type="checkbox" id="wire" /> Fil de fer</label>
        <button type="button" id="reset">Recentrer</button>
      </div>
    </section>

    <script type="module" src="./viewer.js"></script>
  </body>
</html>
