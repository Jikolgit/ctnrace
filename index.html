<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ctnRacer</title>
  </head>
  <body class="in-menu">
    <canvas id="game"></canvas>
    <div id="menu">
      <!-- Côté gauche : les motos s'y afficheront (vide pour l'instant, la scène 3D reste visible derrière) -->
      <aside class="menu-side" aria-label="Motos"></aside>
      <section class="menu-main">
        <header class="menu-top">
          <h1 class="title">ctn<span>Racer</span></h1>
          <div class="menu-actions">
            <button id="mode-bike" class="top-button" type="button">
              <img src="/bike-head.webp" alt="" />
              Moto
            </button>
          </div>
        </header>
        <div class="modes">
          <button id="mode-delivery" class="mode-tile delivery" type="button">
            <span class="art"><img src="/delivery-box.webp" alt="" /></span>
            <span class="label">Livraison</span>
          </button>
          <button id="mode-challenge" class="mode-tile challenge" type="button">
            <span class="art"><img src="/helmet.webp" alt="" /></span>
            <span class="label">Défis</span>
          </button>
          <div class="mode-tile soon" aria-disabled="true">
            <span class="art"></span>
            <span class="label">Bientôt</span>
          </div>
        </div>
      </section>
    </div>
    <div id="garage">
      <h1 class="title">Moto</h1>
      <p class="subtitle">Choisis ta moto</p>
      <canvas id="garage-preview"></canvas>
      <div class="bikes"><!-- cartes créées par garage.js --></div>
      <button id="garage-back" class="close-button" type="button" aria-label="Retour"><img src="/close%20icon.webp" alt="" /></button>
    </div>
    <div id="missions">
      <!-- Même mise en page que le menu principal : côté gauche libre, panneau à droite -->
      <aside class="menu-side"></aside>
      <section class="menu-main">
        <header class="menu-top">
          <h1 class="title">Livraison</h1>
          <div class="menu-actions">
            <button id="missions-back" class="close-button" type="button" aria-label="Retour"><img src="/close%20icon.webp" alt="" /></button>
          </div>
        </header>
        <div class="grid"><!-- vignettes des missions créées par main.js --></div>
      </section>
    </div>
    <div id="hud"><span id="distance">0 m</span><span id="money">0 $</span></div>
    <div id="notice" hidden></div>
    <div id="timer" hidden>2:00</div>
    <div id="cargo" aria-label="Produits à livrer">
      <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 6 56 18v28L32 58 8 46V18Z" fill="#f2b45a" />
          <path d="M32 30 56 18v28L32 58Z" fill="#d68f2f" />
          <path d="M8 18 32 30 56 18 32 6Z" fill="#ffd28a" />
          <path d="M20 12 44 24v8l-6 3v-8L14 15Z" fill="#c9772a" />
          <path d="M32 6 56 18v28L32 58 8 46V18ZM8 18l24 12 24-12M32 30v28" fill="none" stroke="#1b1b1b" stroke-width="4" stroke-linejoin="round" />
        </svg>
      <span class="count">0</span>
    </div>
    <div id="fuel" aria-label="Essence">
      <img src="/jerrycan.png" alt="" />
      <div class="bar"><div class="level"></div></div>
      <span class="value">100</span>
    </div>
    <button id="pause" type="button">Pause</button>
    <div id="start-hint" hidden>
      Appuie sur <span class="key-keyboard">←</span><span class="key-touch">◀</span> pour partir
    </div>
    <div id="turn-arrows">
      <span id="arrow-left" class="turn-arrow" role="img" aria-label="Tourne à gauche" hidden>
        <img class="base" src="/arrow.png" alt="" /><img class="fill" src="/arrow.png" alt="" />
      </span>
      <span id="arrow-uturn" class="turn-arrow" role="img" aria-label="Demi-tour possible (flèche du bas)" hidden>
        <img class="base" src="/arrow-uturn.svg" alt="" /><img class="fill" src="/arrow-uturn.svg" alt="" />
      </span>
      <span id="arrow-right" class="turn-arrow" role="img" aria-label="Tourne à droite" hidden>
        <img class="base" src="/arrow.png" alt="" /><img class="fill" src="/arrow.png" alt="" />
      </span>
    </div>
    <div id="touch-controls">
      <button id="left" type="button" aria-label="Gauche">&#9664;</button>
      <button id="brake" type="button" aria-label="Frein">STOP</button>
      <button id="down" type="button" aria-label="Demi-tour" hidden>&#9660;</button>
      <button id="look-back" type="button" aria-label="Regarder derrière" hidden>ARRIÈRE</button>
      <button id="right" type="button" aria-label="Droite">&#9654;</button>
    </div>
    <div id="unloading" hidden>
      <span class="label">Livraison en cours</span>
      <div class="bar"><div class="level"></div></div>
    </div>
    <div id="mission-complete" hidden>
      <div class="panel">
        <h1>Mission réussie !</h1>
        <p id="mission-summary">Tous les produits sont livrés.</p>
        <div class="actions">
          <button id="complete-missions" type="button">Missions</button>
          <button id="complete-menu" type="button">Menu</button>
        </div>
      </div>
    </div>
    <div id="pause-menu" hidden>
      <div class="panel">
        <h1>Pause</h1>
        <p id="pause-distance">Distance parcourue : 0 m</p>
        <canvas id="minimap" aria-label="Carte du quartier"></canvas>
        <div class="actions">
          <button id="resume" type="button">Reprendre</button>
          <button id="pause-to-menu" type="button">Menu principal</button>
        </div>
        <p class="hint">ou appuie sur P / Échap pour reprendre</p>
      </div>
    </div>
    <div id="gameover" hidden>
      <div class="panel">
        <h1>Game Over</h1>
        <p id="gameover-reason" hidden></p>
        <p>Distance : <span id="final-distance">0 m</span></p>
        <div class="actions">
          <button id="restart" type="button">Rejouer</button>
          <button id="to-menu" type="button">Menu</button>
        </div>
        <p class="hint">ou appuie sur Entrée</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
